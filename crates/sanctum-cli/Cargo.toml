[package]
name = "sanctum-cli"
description = "Sanctum CLI — encrypted chat over Tor hidden services"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sanctum"
path = "src/main.rs"

[dependencies]
sanctum-domain.workspace = true
sanctum-app.workspace = true
sanctum-infra.workspace = true
sanctum-crypto.workspace = true

# CLI
clap.workspace = true

# Async
tokio = { workspace = true, features = ["full", "signal"] }
tokio-util.workspace = true

# Config
toml.workspace = true
dirs.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Terminal
crossterm.workspace = true

# Zeroize
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
bytes.workspace = true

[[example]]
name = "chat_demo"
path = "examples/chat_demo.rs"

[lints]
workspace = true
