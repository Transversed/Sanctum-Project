// Sanctum Wire Protocol — v2
//
// All messages are serialized as protobuf and carried inside
// the length-prefixed Frame (see codec.rs). The Frame.type byte
// determines which protobuf message to decode from the payload.
//
// v2 is not compatible with v1. The version is bound by the Noise
// prologue ("SANCTUM-NOISE-NK-v2"): a v1 peer fails the handshake.

syntax = "proto3";
package sanctum;

// ============================================================
// Handshake (Noise NK)
// ============================================================
//
// Frames 0x01 (C→H) and 0x02 (H→C) carry raw Noise NK handshake
// messages (no protobuf). Every later frame payload is encrypted with
// the resulting Noise transport state.

// ============================================================
// Authentication (Ed25519, bound to the Noise handshake hash)
// ============================================================
//
// signature = Ed25519(identity_sk,
//     "SANCTUM-AUTH-v2" ‖ len‖h ‖ len‖nonce ‖ timestamp(u64 BE)
//     ‖ len‖room_id ‖ len‖server_id)
// where h is the Noise handshake hash and len is a u32 BE length.
// The host derives the fingerprint from ed25519_public_key itself.

// H→C : 0x03
message AuthChallenge {
    bytes nonce = 1;                   // 32 bytes random
    uint64 timestamp = 2;             // Unix seconds
    string room_id = 3;
    bytes server_id = 4;              // SHA-256(host noise static pubkey)
}

// C→H : 0x04
message AuthResponse {
    bytes ed25519_public_key = 1;     // 32 bytes; fingerprint recomputed by the host
    bytes signature = 2;              // see above (64 bytes)
    string display_alias = 3;         // untrusted, sanitized and truncated by the host
    string invite_token = 4;          // owner-signed invite (first join only), else empty
}

// H→C : 0x05
message AuthResult {
    bool success = 1;
    string error_message = 2;         // Set if success == false
    string member_role = 3;           // "owner", "admin", "member"
    RoomState room_state = 4;         // Set if success == true
}

message RoomState {
    string room_id = 1;
    string room_name = 2;
    string mode = 3;                  // "ephemeral" or "persistent"
    RoomConfig config = 4;
    repeated MemberInfo members = 5;
    repeated PreKeyBundle bundles = 6;
}

message RoomConfig {
    uint32 max_members = 1;
    uint32 backlog_max_messages = 2;
    uint32 backlog_max_age_hours = 3;
    uint32 message_padding_block = 4;
}

message MemberInfo {
    string fingerprint = 1;
    string display_alias = 2;
    string role = 3;
    uint64 joined_at = 4;
}

// ============================================================
// Prekey bundles (X3DH)
// ============================================================
//
// spk_signature = Ed25519(identity_sk,
//     "SANCTUM-SPK-v2" ‖ identity_key ‖ signed_pre_key)
// A bundle is accepted only if the signature verifies with
// ed25519_public_key AND Fingerprint(ed25519_public_key) ==
// owner_fingerprint. One-time prekeys are not signed (as in X3DH): a host
// substituting one cannot learn the shared secret.

message OneTimePreKey {
    uint32 id = 1;
    bytes public_key = 2;             // X25519
}

message PreKeyBundle {
    string owner_fingerprint = 1;
    bytes ed25519_public_key = 2;     // long-term identity, fingerprint source
    bytes identity_key = 3;           // IK: X25519, bound by spk_signature
    bytes signed_pre_key = 4;         // SPK: X25519
    bytes spk_signature = 5;
    repeated OneTimePreKey one_time_pre_keys = 6;
}

// C→H : 0x21 — sent once, right after authentication.
message PublishBundle {
    PreKeyBundle bundle = 1;
}

// H→C : 0x23 — bundle of a member who published before the receiver.
// It carries at most one one-time prekey; the host hands each one out
// once. The receiver (the later publisher) initiates X3DH.
message BundleResponse {
    PreKeyBundle bundle = 1;
}

// H→C : 0x24 — the receiver's one-time prekey pool is running low.
message OPKDepleted {
    uint32 remaining = 1;
}

// C→H : 0x25
message RefreshOPK {
    repeated OneTimePreKey new_opks = 1;
}

// C→H→C : 0x20 — X3DH initial message, routed to the recipient only.
// The host stamps sender_fingerprint (I3).
message RatchetKeyExchange {
    string sender_fingerprint = 1;
    string recipient_fingerprint = 2;
    PreKeyBundle sender_identity = 3; // initiator's signed identity, no OPK
    bytes ephemeral_key = 4;          // X3DH ephemeral key
    bool has_opk = 5;
    uint32 opk_id = 6;
    RatchetHeader header = 7;         // first ratchet message (empty plaintext)
    bytes ciphertext = 8;
}

// ============================================================
// Room messages: pairwise fan-out, opaque to the host
// ============================================================
//
// The sender encrypts each message once per recipient with their pairwise
// Double Ratchet session and sends one RoomMessage per recipient.
// Plaintext = pad(timestamp_u64_be ‖ utf8 text, 256 bytes): the host sees
// neither the timestamp nor the exact length. The host forwards the
// RoomMessage to envelope.recipient_fingerprint only, with
// sender_fingerprint stamped from the authenticated connection (I3).

message Envelope {
    string recipient_fingerprint = 1;
    RatchetHeader header = 2;
    bytes ciphertext = 3;
}

// C→H / H→C : 0x10
message RoomMessage {
    string sender_fingerprint = 1;
    uint64 sequence_number = 2;
    Envelope envelope = 3;
}

message RatchetHeader {
    bytes dh_public = 1;              // Current ratchet DH public key
    uint32 previous_chain_length = 2;
    uint32 message_number = 3;
}

// ============================================================
// Room Control
// ============================================================

// C→H / H→C : 0x11
message RoomControl {
    oneof action {
        AllowMember allow_member = 1;
        RevokeMember revoke_member = 2;
        PromoteMember promote_member = 3;
        DemoteMember demote_member = 4;
        UpdateConfig update_config = 5;
    }
}

message AllowMember {
    string fingerprint = 1;
    string role = 2;
}

message RevokeMember {
    string fingerprint = 1;
}

message PromoteMember {
    string fingerprint = 1;
    string new_role = 2;
}

message DemoteMember {
    string fingerprint = 1;
    string new_role = 2;
}

message UpdateConfig {
    RoomConfig config = 1;
}

// ============================================================
// Peer Notifications
// ============================================================

// H→all : 0x12
message PeerReady {
    string fingerprint = 1;
    string display_alias = 2;
}

// H→all : 0x13 — a member disconnected; peers drop its session.
message PeerLeft {
    string fingerprint = 1;
}

// ============================================================
// Backlog (Persistent mode)
// ============================================================

// H→C : 0x30
message BacklogStart {
    uint32 count = 1;                 // Number of messages to follow
}

// H→C : 0x31 (empty payload)
// BacklogEnd has no fields — presence of the frame is sufficient.

// C→H : 0x32
message BacklogAck {
    uint64 last_sequence = 1;         // Highest seq received
}

// ============================================================
// Keepalive
// ============================================================

// 0xFE / 0xFD : Ping and Pong have no payload.
// They use the Frame type byte alone — no protobuf needed.

// ============================================================
// Error
// ============================================================

// 0xFF
message ProtocolError {
    string code = 1;                  // Machine-readable error code
    string message = 2;              // Human-readable description
}
